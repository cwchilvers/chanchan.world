    <template id="info-worth">
        <p>
            Tried to write a song quickly this time, and this was the result. Had it all sketched out with a demo in just a few days, lyrics too (though adjusted over the next couple months). Honeslty think the lyrics here are a step down from "Connection" but whatever.
            <br><br>
            It's kind of a hodgepodge of various styles of music.
    </template>

    <template id="info-connection">
        <p>
            Probably the first song with passable lyrics. Credit goes to Takazo Hall for suggesting Japanese instead of English for the spoken sections.
            <br><br>
            This was another song written with Victoria Nguyen of Atara Ara back in 2023. It was only partially written and got scrapped because we were stumped. 3 years later randomly woke up with this song in my head but in a different style, got permission to finish the song, and got to work. But after reworking everything in the new style I got stumped once again at the same spot, and solving this dragged on for 3 months until I finally figured it out.
            <br><br>
            Credit goes to Victoria for the piano line, which I only tweaked slightly.
        </p>
    </template>

    <template id="info-good-morning">
        <p>
            This one originated from a partial demo I made back in 2021. It was originally just me having fun trying to imitate that late-90s summer hit sound. A few years later I decided to turn it into a whole song, except I couldn't use the chorus from that demo anymore since I'd already used it in "One I Used to Be." I tried writing something new, but kept getting stuck with a generic sound. So I just changed keys halfway through, then doubled that because the chorus was too short.
            <br><br>
            I disliked the synth vocals from the previous song and really wanted a real singer this time, so I finally reached out to someone I knew for help.
            <br><br>
            Lyrics are pretty rough and on the nose in this one, but at least there's a little narrative going on.
        </p>
    </template>

    <template id="info-one-i-used-to-be">
        <p>
            This song was written for a former band I was in, Atara Ara, as the fifth release following "Talk to Me," but got shelved near the end of recording back in 2024. I was given permission a year later to finish it up and release it under chan.chan. Almost all the vocals, along with the chord progression first heard in the opening, were written by Victoria Nguyen of Atara Ara.
            <br><br>
            The chorus chord progression was actually pulled from a 2021 demo of what later became "Good Morning." The key change happened because I didn't know how to transpose that chorus on the spot when I showed it to Victoria.
        </p>
    </template>

    <template id="info-here-then-gone">
        <p>
            Like the first release, I didn't want to deal with people, so I stuck with a vocal synth, this time Synthesizer V instead. Because of that, I kept leaning into the quirky, intentionally a little cringe style, going for something cutesy and weeby but with Y2K sounds and a bit of rock edge in the choruses.
            <br><br>
            The song itself started as an opening theme I wrote for a student short film back in 2021, which I later reworked into a longer song with vocals and a different sound. It was originally meant to be a cute 90s-style anime opening, and I was given the Card Captor Sakura opening theme as a reference. That was one of the most fun short films I composed for.
            <br><br>
            Lyrics are still rough here, except for perhaps the dream part (which was a real dream).
        </p>
    </template>

    <template id="info-2-steps">
        <p>
            This was my first release, my first attempt at writing lyrics, and my first time playing with VOCALOID. At the time I didn't want to deal with other people, but I couldn't sing either. I thought of ways around that: autotune, vocoders, and eventually vocal synthesis.
            <br><br>
            VOCALOID was just a funny thought that came to mind, but I warmed up to the idea. I figured if I was using VOCALOID anyway, I could lean into a quirky, intentionally cringe style for fun instead of doing alt rock, and try something more electronic while I was at it. So I messed around with VOCALOID and this was the result, which is pretty rough all around with some corny, generic motivational lyrics.
        </p>
    </template>
